packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  typescript: ^6.0.3
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.0
  '@types/node': ^26.6.5
  eslint-config-prettier: ^10.1.8
